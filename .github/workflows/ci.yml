name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: uv sync --locked --python 3.11
      - name: Lint
        run: uv run ruff check tensorviewer tests
      - name: Format
        run: uv run ruff format --check tensorviewer tests
      - name: Test
        run: uv run pytest -q

  frontend:
    name: Frontend (format, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Format
        run: npm run format:check
      - name: Types
        run: npx tsc --noEmit -p .
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  interface:
    name: Interface (browser checks and timings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend
        working-directory: backend
        run: uv sync --locked --python 3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps --only-shell chromium
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Browser checks
        working-directory: frontend
        run: npm run e2e
      - name: Keep what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interface-results
          path: frontend/test-results
          retention-days: 7
